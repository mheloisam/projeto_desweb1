<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizLab — Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="screen active">
    <div class="auth-split">

      <!-- Lado esquerdo -->
      <div class="auth-left">
        <div class="auth-left-inner">
          <div class="auth-logo">
            <div class="logo-icon">Q</div>
            <span>Quiz<strong>Lab</strong></span>
          </div>
          <h1 class="auth-headline">Sua jornada de estudos começa aqui.</h1>
          <p class="auth-tagline">Crie sua conta gratuita e comece a criar simulados agora mesmo.</p>
        </div>
      </div>

      <!-- Lado direito -->
      <div class="auth-right">
        <div class="auth-form-wrap">
          <h2 class="form-title">Criar conta</h2>
          <p class="form-subtitle">Preencha os dados abaixo para começar</p>

          {% if erro %}
            <p class="error" style="display:block; margin-bottom: 1rem;">{{ erro }}</p>
          {% endif %}

          <form method="POST" action="{{ url_for('cadastro') }}">
            <div class="form-group">
              <label for="nome">Nome</label>
              <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
            </div>

            <div class="form-group">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
              <label for="senha">Senha</label>
              <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" minlength="6" required>
            </div>

            <button type="submit" class="btn-primary">Criar conta</button>
          </form>

          <p class="link-text">Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></p>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
